# relay-mcp 自身的 CI:结构检查(用自身引擎跑自身)+ 端到端冒烟
# 版本矩阵对齐真实开发环境——单一旧版本会掩盖 node --test 之类的跨版本行为差异(三轮审计 N1 教训)
name: ci
on:
  push:
  pull_request:
# 最小权限:流水线只读仓库内容,不发 token 写权限
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          # 协议本身要考古历史提交(R10 独立定位完成提交、事实行校验历史 sha、
          # smoke-t021-decision 反查 DECISIONS 引用的提交)。默认 depth:1 的浅克隆
          # 拿不到这些历史对象,会让协议在 CI 上与本地表现不一致。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: whitespace and conflict-marker check
        shell: bash
        run: |
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base...HEAD"
          git diff-tree --check --root -r HEAD
      - name: relay verify (structure, self-hosted engine)
        run: node src/cli.mjs relay_verify --root .
      - name: smoke tests (protocol, patches and worktree lifecycle)
        run: npm test
